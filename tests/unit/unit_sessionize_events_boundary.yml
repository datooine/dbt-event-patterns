unit_tests:
  - name: unit_macro_sessionize_events_boundary
    description: "boundary_key splits sessions across complete buckets"
    model: macro_sessionize_events_boundary
    given:
      - input: ref('macro_sessionize_events_boundary_data')
        rows:
          - { event_id: 'a', user_id: 'u1', event_type: 'A', event_at: '2026-01-01 23:59:59' }
          - { event_id: 'b', user_id: 'u1', event_type: 'A', event_at: '2026-01-02 00:00:01' }
          - { event_id: 'c', user_id: 'u1', event_type: 'A', event_at: '2026-01-02 00:00:04' }
    expect:
      rows:
        - { event_id: 'a', session_start_ts: '2026-01-01 23:59:59', session_end_ts: '2026-01-01 23:59:59', session_event_count: 1, session_event_seq_num_asc: 1, session_event_seq_num_desc: 1, session_id_length: 64 }
        - { event_id: 'b', session_start_ts: '2026-01-02 00:00:01', session_end_ts: '2026-01-02 00:00:04', session_event_count: 2, session_event_seq_num_asc: 1, session_event_seq_num_desc: 2, session_id_length: 64 }
        - { event_id: 'c', session_start_ts: '2026-01-02 00:00:01', session_end_ts: '2026-01-02 00:00:04', session_event_count: 2, session_event_seq_num_asc: 2, session_event_seq_num_desc: 1, session_id_length: 64 }
