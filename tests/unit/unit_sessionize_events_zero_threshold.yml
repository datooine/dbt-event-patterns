unit_tests:
  - name: unit_macro_sessionize_events_zero_threshold
    description: "zero threshold keeps identical timestamps together and splits later timestamps"
    model: macro_sessionize_events_zero_threshold
    given:
      - input: ref('macro_sessionize_events_zero_threshold_data')
        rows:
          - { event_id: 'a', user_id: 'u1', event_at: '2026-01-01 00:00:00' }
          - { event_id: 'b', user_id: 'u1', event_at: '2026-01-01 00:00:00' }
          - { event_id: 'c', user_id: 'u1', event_at: '2026-01-01 00:00:01' }
    expect:
      rows:
        - { event_id: 'a', session_start_ts: '2026-01-01 00:00:00', session_end_ts: '2026-01-01 00:00:00', session_event_count: 2, session_event_seq_num_asc: 1, session_event_seq_num_desc: 2, session_id_length: 64 }
        - { event_id: 'b', session_start_ts: '2026-01-01 00:00:00', session_end_ts: '2026-01-01 00:00:00', session_event_count: 2, session_event_seq_num_asc: 2, session_event_seq_num_desc: 1, session_id_length: 64 }
        - { event_id: 'c', session_start_ts: '2026-01-01 00:00:01', session_end_ts: '2026-01-01 00:00:01', session_event_count: 1, session_event_seq_num_asc: 1, session_event_seq_num_desc: 1, session_id_length: 64 }
