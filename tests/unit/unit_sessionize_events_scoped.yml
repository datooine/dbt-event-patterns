    expect:
      rows:
        - { event_id: 'a', user_id: 'u1', event_type: 'A', session_start_ts: '2026-01-01 00:00:00', session_end_ts: '2026-01-01 00:00:09', session_event_count: 3, session_event_seq_num_asc: 1, session_event_seq_num_desc: 3, session_id_length: 64 }
