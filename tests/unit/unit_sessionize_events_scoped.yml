    given:
      - input: ref('macro_sessionize_events_data')
        rows:
          - { event_id: 'a', user_id: 'u1', event_type: 'A', order_id: 'o1', ingested_at: '2026-01-01 00:00:00', source_row_number: 1, event_at: '2026-01-01 00:00:00' }
