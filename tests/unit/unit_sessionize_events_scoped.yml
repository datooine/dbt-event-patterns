        - { event_id: 'g', user_id: 'u3', event_type: null, session_start_ts: '2026-01-01 00:00:00', session_end_ts: '2026-01-01 00:00:03', session_event_count: 2, session_event_seq_num_asc: 1, session_event_seq_num_desc: 2, session_id_length: 64 }
